  <text x="978" y="946" text-anchor="middle" fill="#667085" font-size="11.4" font-family="Arial,Helvetica,sans-serif">optimizer update flows only to KeypointDominantFusionNet parameters</text>

  
  <path d="M1000 250 L1042 250 L1042 165 L930 165 L930 205" fill="none" stroke="#374151" stroke-width="3.2" stroke-dasharray="8 7" marker-end="url(#arrs)" />
