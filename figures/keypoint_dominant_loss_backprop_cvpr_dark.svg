  <text x="720" y="694" fill="#667085" font-size="11.4" font-family="Arial,Helvetica,sans-serif">rv, ri source maps use no_grad</text>
  <path d="M1000 564 L1030 564 L1030 865 L1540 865 L1540 690 L1580 690" fill="none" stroke="#0b6b3a" stroke-width="3.2" stroke-dasharray="8 7" marker-end="url(#arrg)" />
