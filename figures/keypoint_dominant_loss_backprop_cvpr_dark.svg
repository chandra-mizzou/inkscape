<svg xmlns="http://www.w3.org/2000/svg" width="1900" height="1080" viewBox="0 0 1900 1080" role="img" aria-labelledby="title desc">
  <title id="title">Clean CVPR diagram of keypoint-centric loss and backpropagation</title>
  <desc id="desc">Straight-line training diagram with trainable fusion network, frozen KeyNet, keypoint-centric losses, validation metrics, and optimizer update.</desc>
  <defs>
    <marker id="arr" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth"><path d="M2,2 L10,6 L2,10 Z" fill="#263238" /></marker>
    <marker id="arrg" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth"><path d="M2,2 L10,6 L2,10 Z" fill="#16844d" /></marker>
    <marker id="arrr" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth"><path d="M2,2 L10,6 L2,10 Z" fill="#c92a2a" /></marker>
    <marker id="arrb" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth"><path d="M2,2 L10,6 L2,10 Z" fill="#1f6fb2" /></marker>
    <marker id="arrp" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth"><path d="M2,2 L10,6 L2,10 Z" fill="#7453c8" /></marker>
    <marker id="arrs" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth"><path d="M2,2 L10,6 L2,10 Z" fill="#667085" /></marker>
    </defs>
  <rect width="1900" height="1080" fill="#ffffff" />
  <text x="950" y="52" text-anchor="middle" fill="#101828" font-weight="700" font-size="34" font-family="Arial,Helvetica,sans-serif">Keypoint-Centric Loss and Backpropagation</text>
  <text x="950" y="82" text-anchor="middle" fill="#475467" font-size="18" font-family="Arial,Helvetica,sans-serif">Clean straight-line training figure: frozen KeyNet supervision and trainable fusion-network update</text>

  <rect x="55" y="125" width="260" height="760" rx="22" fill="none" stroke="#344054" stroke-width="2" stroke-dasharray="9 7" /><text x="185" y="155" text-anchor="middle" fill="#344054" letter-spacing=".3px" font-weight="700" font-size="17" font-family="Arial,Helvetica,sans-serif">Batch inputs</text>
  <rect x="350" y="125" width="320" height="760" rx="22" fill="none" stroke="#344054" stroke-width="2" stroke-dasharray="9 7" /><text x="510" y="155" text-anchor="middle" fill="#344054" letter-spacing=".3px" font-weight="700" font-size="17" font-family="Arial,Helvetica,sans-serif">Trainable model</text>
  <rect x="705" y="125" width="330" height="760" rx="22" fill="none" stroke="#344054" stroke-width="2" stroke-dasharray="9 7" /><text x="870" y="155" text-anchor="middle" fill="#344054" letter-spacing=".3px" font-weight="700" font-size="17" font-family="Arial,Helvetica,sans-serif">Frozen KeyNet response</text>
  <rect x="1070" y="125" width="445" height="760" rx="22" fill="none" stroke="#344054" stroke-width="2" stroke-dasharray="9 7" /><text x="1292" y="155" text-anchor="middle" fill="#344054" letter-spacing=".3px" font-weight="700" font-size="17" font-family="Arial,Helvetica,sans-serif">Loss computation</text>
  <rect x="1550" y="125" width="295" height="760" rx="22" fill="none" stroke="#344054" stroke-width="2" stroke-dasharray="9 7" /><text x="1698" y="155" text-anchor="middle" fill="#344054" letter-spacing=".3px" font-weight="700" font-size="17" font-family="Arial,Helvetica,sans-serif">Update and evaluation</text>

  <rect x="90" y="205" width="190" height="70" fill="#f8fafc" stroke="#111827" stroke-width="3" rx="14" /><text x="185" y="234" text-anchor="middle" fill="#101828" font-weight="700" font-size="15.5" font-family="Arial,Helvetica,sans-serif">Visible RGB</text><text x="185" y="257" text-anchor="middle" fill="#344054" font-size="12.8" font-family="Arial,Helvetica,sans-serif">v: B x 3 x H x W</text>
  <rect x="90" y="320" width="190" height="70" fill="#f8fafc" stroke="#111827" stroke-width="3" rx="14" /><text x="185" y="349" text-anchor="middle" fill="#101828" font-weight="700" font-size="15.5" font-family="Arial,Helvetica,sans-serif">Infrared</text><text x="185" y="372" text-anchor="middle" fill="#344054" font-size="12.8" font-family="Arial,Helvetica,sans-serif">i: B x 1 x H x W</text>
  <rect x="90" y="435" width="190" height="70" fill="#f8fafc" stroke="#111827" stroke-width="3" rx="14" /><text x="185" y="464" text-anchor="middle" fill="#101828" font-weight="700" font-size="15.5" font-family="Arial,Helvetica,sans-serif">Reference GT</text><text x="185" y="487" text-anchor="middle" fill="#344054" font-size="12.8" font-family="Arial,Helvetica,sans-serif">gt: B x 3 x H x W</text>
  <rect x="90" y="610" width="190" height="112" fill="#fffdf7" stroke="#111827" stroke-width="3" rx="14" /><text x="185" y="640" text-anchor="middle" fill="#101828" font-weight="700" font-size="15.5" font-family="Arial,Helvetica,sans-serif">Source signals</text><text x="185" y="665" text-anchor="middle" fill="#344054" font-size="12.8" font-family="Arial,Helvetica,sans-serif">vis_y = luma(v)</text><text x="185" y="688" text-anchor="middle" fill="#344054" font-size="12.8" font-family="Arial,Helvetica,sans-serif">g_union = max</text><text x="185" y="710" text-anchor="middle" fill="#667085" font-size="11.4" font-family="Arial,Helvetica,sans-serif">VIS and IR gradients</text>

  <rect x="385" y="225" width="250" height="245" fill="#fff2e8" stroke="#111827" stroke-width="3" rx="16" /><text x="510" y="256" text-anchor="middle" fill="#101828" font-weight="700" font-size="15.5" font-family="Arial,Helvetica,sans-serif">KeypointDominantFusionNet</text><text x="510" y="284" text-anchor="middle" fill="#344054" font-size="12.8" font-family="Arial,Helvetica,sans-serif">encoders + DCA blocks</text><text x="510" y="307" text-anchor="middle" fill="#344054" font-size="12.8" font-family="Arial,Helvetica,sans-serif">decoder + prediction heads</text><text x="510" y="330" text-anchor="middle" fill="#344054" font-size="12.8" font-family="Arial,Helvetica,sans-serif">return_aux=True</text><text x="510" y="360" text-anchor="middle" fill="#667085" font-size="11.4" font-family="Arial,Helvetica,sans-serif">fused, pred_rgb, ir_w</text><text x="510" y="381" text-anchor="middle" fill="#667085" font-size="11.4" font-family="Arial,Helvetica,sans-serif">target_y, [w1,w2,w3]</text>
  <g transform="translate(574,392)"><path d="M24 52 C7 42 8 25 19 12 C20 24 31 24 29 4 C49 21 53 38 43 51 C38 58 29 58 24 52 Z" fill="#ff8a1f" stroke="#b45309" stroke-width="2" /><path d="M28 53 C20 47 22 36 31 27 C32 38 40 39 39 30 C49 42 45 55 36 58 C33 59 30 57 28 53 Z" fill="#ffd166" stroke="#f59e0b" stroke-width="1.5" /></g>
  <rect x="385" y="590" width="250" height="132" fill="#f4f8ff" stroke="#111827" stroke-width="3" rx="14" /><text x="510" y="621" text-anchor="middle" fill="#101828" font-weight="700" font-size="15.5" font-family="Arial,Helvetica,sans-serif">Training mechanics</text><text x="510" y="647" text-anchor="middle" fill="#344054" font-size="12.8" font-family="Arial,Helvetica,sans-serif">AMP + GradScaler</text><text x="510" y="670" text-anchor="middle" fill="#344054" font-size="12.8" font-family="Arial,Helvetica,sans-serif">AdamW, weight decay</text><text x="510" y="693" text-anchor="middle" fill="#344054" font-size="12.8" font-family="Arial,Helvetica,sans-serif">clip grad norm = 0.8</text>

  <rect x="740" y="205" width="260" height="180" fill="#eaf7ff" stroke="#111827" stroke-width="3" rx="16" /><text x="870" y="236" text-anchor="middle" fill="#101828" font-weight="700" font-size="15.5" font-family="Arial,Helvetica,sans-serif">Frozen KeyNetResponse</text><text x="870" y="264" text-anchor="middle" fill="#344054" font-size="12.8" font-family="Arial,Helvetica,sans-serif">KF.KeyNet detector</text><text x="870" y="287" text-anchor="middle" fill="#344054" font-size="12.8" font-family="Arial,Helvetica,sans-serif">eval(), requires_grad=False</text><text x="870" y="315" text-anchor="middle" fill="#667085" font-size="11.4" font-family="Arial,Helvetica,sans-serif">extracts normalized response maps</text>
  <g transform="translate(933,314)"><circle cx="26" cy="26" r="24" fill="#fff" stroke="#86c5e8" stroke-width="1.6" /><line x1="26" y1="6" x2="26" y2="46" stroke="#1d9bd7" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><line x1="9" y1="16" x2="43" y2="36" stroke="#1d9bd7" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><line x1="9" y1="36" x2="43" y2="16" stroke="#1d9bd7" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><line x1="20" y1="12" x2="26" y2="18" stroke="#1d9bd7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><line x1="32" y1="12" x2="26" y2="18" stroke="#1d9bd7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><line x1="20" y1="40" x2="26" y2="34" stroke="#1d9bd7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><line x1="32" y1="40" x2="26" y2="34" stroke="#1d9bd7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /></g>
  <rect x="740" y="475" width="260" height="178" fill="#fffdf7" stroke="#111827" stroke-width="3" rx="14" /><text x="870" y="506" text-anchor="middle" fill="#101828" font-weight="700" font-size="15.5" font-family="Arial,Helvetica,sans-serif">Response maps</text><text x="870" y="533" text-anchor="middle" fill="#344054" font-size="12.8" font-family="Arial,Helvetica,sans-serif">rv = KeyNet(mean(v))</text><text x="870" y="555" text-anchor="middle" fill="#667085" font-size="11.4" font-family="Arial,Helvetica,sans-serif">source VIS: no_grad</text><text x="870" y="581" text-anchor="middle" fill="#344054" font-size="12.8" font-family="Arial,Helvetica,sans-serif">ri = KeyNet(i)</text><text x="870" y="603" text-anchor="middle" fill="#667085" font-size="11.4" font-family="Arial,Helvetica,sans-serif">source IR: no_grad</text><text x="870" y="629" text-anchor="middle" fill="#344054" font-size="12.8" font-family="Arial,Helvetica,sans-serif">rf = KeyNet(mean(fused))</text>

  <rect x="1105" y="185" width="375" height="150" fill="#f3ecff" stroke="#111827" stroke-width="3" rx="14" /><text x="1292" y="216" text-anchor="middle" fill="#101828" font-weight="700" font-size="15.5" font-family="Arial,Helvetica,sans-serif">Keypoint loss</text><text x="1292" y="242" text-anchor="middle" fill="#344054" font-size="12.8" font-family="Arial,Helvetica,sans-serif">union = max(rv, ri), peak_w = 1 + 2.5*union</text><text x="1292" y="265" text-anchor="middle" fill="#344054" font-size="12.8" font-family="Arial,Helvetica,sans-serif">kp = 1.8*kp_union + 1.4*kp_miss + 0.3*kp_novel</text><text x="1292" y="290" text-anchor="middle" fill="#667085" font-size="11.4" font-family="Arial,Helvetica,sans-serif">encourages retention of VIS/IR keypoint responses</text>
  <rect x="1105" y="390" width="375" height="108" fill="#f3ecff" stroke="#111827" stroke-width="3" rx="14" /><text x="1292" y="421" text-anchor="middle" fill="#101828" font-weight="700" font-size="15.5" font-family="Arial,Helvetica,sans-serif">Gradient preservation</text><text x="1292" y="448" text-anchor="middle" fill="#344054" font-size="12.8" font-family="Arial,Helvetica,sans-serif">grad = mean(abs(norm(|grad y_f|) - norm(g_union)))</text><text x="1292" y="472" text-anchor="middle" fill="#667085" font-size="11.4" font-family="Arial,Helvetica,sans-serif">keeps the strongest edge map from the two sources</text>
  <rect x="1105" y="555" width="375" height="128" fill="#f3ecff" stroke="#111827" stroke-width="3" rx="14" /><text x="1292" y="586" text-anchor="middle" fill="#101828" font-weight="700" font-size="15.5" font-family="Arial,Helvetica,sans-serif">Anchor losses</text><text x="1292" y="613" text-anchor="middle" fill="#344054" font-size="12.8" font-family="Arial,Helvetica,sans-serif">src = mean(abs(y_f - target_y))</text><text x="1292" y="636" text-anchor="middle" fill="#344054" font-size="12.8" font-family="Arial,Helvetica,sans-serif">gt = L1(fused, gt) + 0.5*SSIM(fused, gt)</text><text x="1292" y="660" text-anchor="middle" fill="#667085" font-size="11.4" font-family="Arial,Helvetica,sans-serif">weak convergence and structure anchor</text>
  <rect x="1105" y="745" width="375" height="88" fill="#fffdf7" stroke="#111827" stroke-width="3" rx="14" /><text x="1292" y="777" text-anchor="middle" fill="#101828" font-weight="700" font-size="15.5" font-family="Arial,Helvetica,sans-serif">Total objective</text><text x="1292" y="805" text-anchor="middle" fill="#344054" font-size="12.8" font-family="Arial,Helvetica,sans-serif">L = 1.0*kp + 0.85*grad + 0.20*src + 0.05*gt</text>

  <rect x="1580" y="205" width="230" height="124" fill="#f4f8ff" stroke="#111827" stroke-width="3" rx="14" /><text x="1695" y="236" text-anchor="middle" fill="#101828" font-weight="700" font-size="15.5" font-family="Arial,Helvetica,sans-serif">Backpropagation</text><text x="1695" y="263" text-anchor="middle" fill="#344054" font-size="12.8" font-family="Arial,Helvetica,sans-serif">scaler.scale(L).backward()</text><text x="1695" y="290" text-anchor="middle" fill="#667085" font-size="11.4" font-family="Arial,Helvetica,sans-serif">KeyNet frozen; gradients update fusion net</text>
  <rect x="1580" y="385" width="230" height="116" fill="#f4f8ff" stroke="#111827" stroke-width="3" rx="14" /><text x="1695" y="416" text-anchor="middle" fill="#101828" font-weight="700" font-size="15.5" font-family="Arial,Helvetica,sans-serif">Optimizer step</text><text x="1695" y="443" text-anchor="middle" fill="#344054" font-size="12.8" font-family="Arial,Helvetica,sans-serif">unscale -&gt; clip -&gt; step</text><text x="1695" y="468" text-anchor="middle" fill="#667085" font-size="11.4" font-family="Arial,Helvetica,sans-serif">AdamW + GradScaler update</text>
  <rect x="1580" y="585" width="230" height="210" fill="#ecfdf3" stroke="#111827" stroke-width="3" rx="14" /><text x="1695" y="616" text-anchor="middle" fill="#101828" font-weight="700" font-size="15.5" font-family="Arial,Helvetica,sans-serif">Validation metrics</text><text x="1695" y="643" text-anchor="middle" fill="#344054" font-size="12.8" font-family="Arial,Helvetica,sans-serif">top-k response masks</text><text x="1695" y="668" text-anchor="middle" fill="#667085" font-size="11.4" font-family="Arial,Helvetica,sans-serif">ret_vis, ret_ir</text><text x="1695" y="690" text-anchor="middle" fill="#667085" font-size="11.4" font-family="Arial,Helvetica,sans-serif">union_recall</text><text x="1695" y="712" text-anchor="middle" fill="#667085" font-size="11.4" font-family="Arial,Helvetica,sans-serif">union_precision</text><text x="1695" y="734" text-anchor="middle" fill="#667085" font-size="11.4" font-family="Arial,Helvetica,sans-serif">balance_f1</text><text x="1695" y="762" text-anchor="middle" fill="#344054" font-size="12.8" font-family="Arial,Helvetica,sans-serif">overall = 0.5*uR + 0.5*F1</text>

  
