  <rect x="70" y="910" width="1760" height="110" rx="18" fill="#f8fafc" stroke="#e4e7ec" stroke-width="1.2" />
  <text x="95" y="942" fill="#344054" font-size="12.5" font-family="Arial,Helvetica,sans-serif">Faithfulness check: this figure follows KeypointCentricLoss and evaluate_keypoint_retention: KeyNetResponse is frozen, rv/ri are source targets under no_grad, rf supervises fused output, and total loss backpropagates to the fusion model.</text>
  <text x="95" y="970" fill="#344054" font-size="12.5" font-family="Arial,Helvetica,sans-serif">The trainable network block has a vector fire icon at the bottom right. The frozen KeyNet block has a vector snowflake icon at the bottom right, as requested.</text>
  <text x="95" y="998" fill="#344054" font-size="12.5" font-family="Arial,Helvetica,sans-serif">Connector convention: green = forward/evaluation, red = backward/update, blue = source inputs, gray dashed = frozen or stopped-gradient boundary.</text>
</svg>