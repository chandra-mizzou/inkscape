<svg xmlns="http://www.w3.org/2000/svg" width="1900" height="1080" viewBox="0 0 1900 1080" role="img" aria-labelledby="title desc">
  <title id="title">Clean CVPR diagram of KeypointDominantFusionNet</title>
  <desc id="desc">Straight-line block diagram of the KeypointDominantFusionNet architecture from the provided code.</desc>
  <defs>
    <marker id="arr" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth"><path d="M2,2 L10,6 L2,10 Z" fill="#263238"/></marker>
    <marker id="arrb" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth"><path d="M2,2 L10,6 L2,10 Z" fill="#1f6fb2"/></marker>
    <marker id="arrr" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth"><path d="M2,2 L10,6 L2,10 Z" fill="#c44a2d"/></marker>
    <marker id="arrp" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth"><path d="M2,2 L10,6 L2,10 Z" fill="#7453c8"/></marker>
    <marker id="arrg" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth"><path d="M2,2 L10,6 L2,10 Z" fill="#16844d"/></marker>
    <filter id="shadow" x="-8%" y="-8%" width="116%" height="124%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#111827" flood-opacity="0.12"/></filter>
    <style>
      .bg{fill:#fff}.title{font:700 34px Arial,Helvetica,sans-serif;fill:#101828}.sub{font:18px Arial,Helvetica,sans-serif;fill:#475467}.sec{fill:none;stroke:#d0d5dd;stroke-width:1.4;stroke-dasharray:9 7;rx:22}.sect{font:700 17px Arial,Helvetica,sans-serif;fill:#344054;letter-spacing:.3px}.bt{font:700 15px Arial,Helvetica,sans-serif;fill:#101828}.txt{font:12.8px Arial,Helvetica,sans-serif;fill:#344054}.sm{font:11.4px Arial,Helvetica,sans-serif;fill:#667085}.vis{fill:#eaf5ff;stroke:#5aa1dd;stroke-width:2;rx:14;filter:url(#shadow)}.ir{fill:#fff0ea;stroke:#ed7b62;stroke-width:2;rx:14;filter:url(#shadow)}.cue{fill:#fff9dc;stroke:#d2a60f;stroke-width:1.8;rx:14;filter:url(#shadow)}.dca{fill:#f3ecff;stroke:#8d6bd8;stroke-width:2;rx:14;filter:url(#shadow)}.dec{fill:#f5f7fb;stroke:#98a2b3;stroke-width:2;rx:14;filter:url(#shadow)}.out{fill:#ecfdf3;stroke:#2fa463;stroke-width:2;rx:14;filter:url(#shadow)}.math{fill:#fffdf7;stroke:#f0c541;stroke-width:1.6;rx:14;filter:url(#shadow)}.line{fill:none;stroke:#263238;stroke-width:2.4;marker-end:url(#arr)}.blue{stroke:#1f6fb2;marker-end:url(#arrb)}.red{stroke:#c44a2d;marker-end:url(#arrr)}.purple{stroke:#7453c8;marker-end:url(#arrp)}.green{stroke:#16844d;marker-end:url(#arrg)}.dash{stroke-dasharray:8 7}.thin{stroke-width:1.9}.chip{fill:#fff;stroke:#d0d5dd;stroke-width:1.1;rx:8}.legend{font:12.5px Arial,Helvetica,sans-serif;fill:#344054}
    </style>
  </defs>
  <rect class="bg" width="1900" height="1080"/>
  <text class="title" x="950" y="52" text-anchor="middle">KeypointDominantFusionNet Architecture</text>
  <text class="sub" x="950" y="82" text-anchor="middle">Straight-line CVPR figure derived from the provided PyTorch implementation</text>

  <rect class="sec" x="55" y="125" width="230" height="780" rx="22"/><text class="sect" x="170" y="155" text-anchor="middle">Inputs</text>
  <rect class="sec" x="315" y="125" width="210" height="780" rx="22"/><text class="sect" x="420" y="155" text-anchor="middle">Content cues</text>
  <rect class="sec" x="555" y="125" width="690" height="780" rx="22"/><text class="sect" x="900" y="155" text-anchor="middle">Three-scale dual encoder with dominance cross-attention</text>
  <rect class="sec" x="1275" y="125" width="235" height="780" rx="22"/><text class="sect" x="1392" y="155" text-anchor="middle">Decoder</text>
  <rect class="sec" x="1540" y="125" width="305" height="780" rx="22"/><text class="sect" x="1692" y="155" text-anchor="middle">Heads and reconstruction</text>

  <rect class="vis" x="88" y="210" width="165" height="82"/><text class="bt" x="170" y="241" text-anchor="middle">Visible RGB</text><text class="txt" x="170" y="266" text-anchor="middle">v: B x 3 x H x W</text>
  <rect class="ir" x="88" y="345" width="165" height="82"/><text class="bt" x="170" y="376" text-anchor="middle">Infrared</text><text class="txt" x="170" y="401" text-anchor="middle">i: B x 1 x H x W</text>
  <rect class="math" x="88" y="480" width="165" height="132"/><text class="bt" x="170" y="512" text-anchor="middle">Luma helpers</text><text class="txt" x="170" y="538" text-anchor="middle">vis_y = luma(v)</text><text class="txt" x="170" y="561" text-anchor="middle">pred_y = luma(pred)</text><text class="txt" x="170" y="584" text-anchor="middle">y_f = luma(fused)</text>

  <rect class="cue" x="333" y="210" width="174" height="130"/><text class="bt" x="420" y="241" text-anchor="middle">VIS cue</text><text class="txt" x="420" y="266" text-anchor="middle">brightness + edge</text><text class="txt" x="420" y="289" text-anchor="middle">+ local contrast</text><text class="sm" x="420" y="315" text-anchor="middle">normalize + blur</text>
  <rect class="cue" x="333" y="370" width="174" height="130"/><text class="bt" x="420" y="401" text-anchor="middle">IR cue</text><text class="txt" x="420" y="426" text-anchor="middle">brightness + edge</text><text class="txt" x="420" y="449" text-anchor="middle">+ local contrast</text><text class="sm" x="420" y="475" text-anchor="middle">normalize + blur</text>
  <rect class="cue" x="333" y="665" width="174" height="86"/><text class="bt" x="420" y="696" text-anchor="middle">Cue bus</text><text class="txt" x="420" y="722" text-anchor="middle">resize to L1/L2/L3</text>

  <!-- Scale 1 -->
  <rect class="vis" x="585" y="190" width="160" height="82"/><text class="bt" x="665" y="219" text-anchor="middle">VIS Enc L1</text><text class="txt" x="665" y="243" text-anchor="middle">ConvBNAct x2</text><text class="sm" x="665" y="263" text-anchor="middle">3 -> b, H x W</text>
  <rect class="ir" x="585" y="330" width="160" height="82"/><text class="bt" x="665" y="359" text-anchor="middle">IR Enc L1</text><text class="txt" x="665" y="383" text-anchor="middle">ConvBNAct x2</text><text class="sm" x="665" y="403" text-anchor="middle">1 -> b, H x W</text>
  <rect class="dca" x="785" y="252" width="175" height="100"/><text class="bt" x="872" y="282" text-anchor="middle">DCA L1</text><text class="txt" x="872" y="307" text-anchor="middle">cat[v1,i1,c1v,c1i]</text><text class="sm" x="872" y="330" text-anchor="middle">returns v1', i1', w1</text>

  <!-- Scale 2 -->
  <rect class="vis" x="1000" y="190" width="160" height="82"/><text class="bt" x="1080" y="219" text-anchor="middle">VIS Enc L2</text><text class="txt" x="1080" y="243" text-anchor="middle">stride2 + Conv</text><text class="sm" x="1080" y="263" text-anchor="middle">b -> 2b, H/2</text>
  <rect class="ir" x="1000" y="330" width="160" height="82"/><text class="bt" x="1080" y="359" text-anchor="middle">IR Enc L2</text><text class="txt" x="1080" y="383" text-anchor="middle">stride2 + Conv</text><text class="sm" x="1080" y="403" text-anchor="middle">b -> 2b, H/2</text>
  <rect class="dca" x="1000" y="490" width="175" height="100"/><text class="bt" x="1088" y="520" text-anchor="middle">DCA L2</text><text class="txt" x="1088" y="545" text-anchor="middle">cue resized H/2</text><text class="sm" x="1088" y="568" text-anchor="middle">returns v2', i2', w2</text>

  <!-- Scale 3 -->
  <rect class="vis" x="785" y="650" width="160" height="82"/><text class="bt" x="865" y="679" text-anchor="middle">VIS Enc L3</text><text class="txt" x="865" y="703" text-anchor="middle">stride2 + Conv</text><text class="sm" x="865" y="723" text-anchor="middle">2b -> 4b, H/4</text>
  <rect class="ir" x="1000" y="650" width="160" height="82"/><text class="bt" x="1080" y="679" text-anchor="middle">IR Enc L3</text><text class="txt" x="1080" y="703" text-anchor="middle">stride2 + Conv</text><text class="sm" x="1080" y="723" text-anchor="middle">2b -> 4b, H/4</text>
  <rect class="dca" x="785" y="790" width="375" height="80"/><text class="bt" x="972" y="819" text-anchor="middle">DCA L3</text><text class="txt" x="972" y="844" text-anchor="middle">cat[v3,i3,c3v,c3i] -> v3', i3', w3</text>

  <rect class="math" x="585" y="490" width="340" height="96"/><text class="bt" x="755" y="520" text-anchor="middle">Inside each DCA</text><text class="txt" x="755" y="546" text-anchor="middle">softmax logits -> w_self, w_cross, w_shared</text><text class="sm" x="755" y="568" text-anchor="middle">1x1 projections and residual cross-update</text>

  <rect class="dec" x="1300" y="206" width="185" height="96"/><text class="bt" x="1392" y="236" text-anchor="middle">Top fusion</text><text class="txt" x="1392" y="262" text-anchor="middle">cat[v3',i3']</text><text class="sm" x="1392" y="283" text-anchor="middle">8b -> 4b -> 4b</text>
  <rect class="dec" x="1300" y="385" width="185" height="106"/><text class="bt" x="1392" y="416" text-anchor="middle">Up2 + Dec2</text><text class="txt" x="1392" y="442" text-anchor="middle">upsample x2</text><text class="sm" x="1392" y="465" text-anchor="middle">cat[d2,v2',i2']</text>
  <rect class="dec" x="1300" y="575" width="185" height="106"/><text class="bt" x="1392" y="606" text-anchor="middle">Up1 + Dec1</text><text class="txt" x="1392" y="632" text-anchor="middle">upsample x2</text><text class="sm" x="1392" y="655" text-anchor="middle">cat[d1,v1',i1']</text>

  <rect class="dec" x="1570" y="185" width="115" height="88"/><text class="bt" x="1628" y="216" text-anchor="middle">RGB head</text><text class="txt" x="1628" y="242" text-anchor="middle">1x1 conv</text><text class="sm" x="1628" y="261" text-anchor="middle">pred_rgb</text>
  <rect class="dec" x="1710" y="185" width="115" height="88"/><text class="bt" x="1768" y="216" text-anchor="middle">IR weight</text><text class="txt" x="1768" y="242" text-anchor="middle">1x1 conv</text><text class="sm" x="1768" y="261" text-anchor="middle">+ dom bias</text>
  <rect class="math" x="1570" y="350" width="255" height="126"/><text class="bt" x="1698" y="381" text-anchor="middle">Dominance-guided target</text><text class="txt" x="1698" y="407" text-anchor="middle">ir_w = sigmoid(logits + 1.5*dom)</text><text class="txt" x="1698" y="430" text-anchor="middle">target_y = (1-ir_w)*vis_y + ir_w*i</text><text class="sm" x="1698" y="454" text-anchor="middle">ir_w clamp + Gaussian smooth</text>
  <rect class="math" x="1570" y="540" width="255" height="116"/><text class="bt" x="1698" y="571" text-anchor="middle">Luma/color reconstruction</text><text class="txt" x="1698" y="597" text-anchor="middle">fused_y = (1-mix)*target_y + mix*pred_y</text><text class="txt" x="1698" y="620" text-anchor="middle">vis_color = v * clamp(fused_y/vis_y)</text><text class="sm" x="1698" y="642" text-anchor="middle">ratio clamp: 0.55 to 1.55</text>
  <rect class="out" x="1570" y="720" width="255" height="92"/><text class="bt" x="1698" y="754" text-anchor="middle">Final fused RGB</text><text class="txt" x="1698" y="781" text-anchor="middle">(1-mix)*vis_color + mix*pred_rgb</text>
  <rect class="out" x="1570" y="845" width="255" height="50"/><text class="txt" x="1698" y="875" text-anchor="middle">Aux: pred_rgb, ir_w, target_y, [w1,w2,w3]</text>

  <!-- Inputs to cues and encoders -->
  <path class="line blue" d="M253 251 L333 251"/><path class="line red" d="M253 386 L333 386"/>
  <path class="line blue" d="M253 251 L548 251 L548 231 L585 231"/><path class="line red" d="M253 386 L548 386 L548 371 L585 371"/>
  <path class="line thin" d="M420 340 L420 665"/><path class="line thin" d="M420 500 L420 665"/>

  <!-- L1 to DCA -->
  <path class="line blue" d="M745 231 L765 231 L765 286 L785 286"/><path class="line red" d="M745 371 L765 371 L765 320 L785 320"/>
  <path class="line dash thin" d="M507 708 L770 708 L770 340 L785 340"/>

  <!-- DCA L1 to L2 -->
  <path class="line blue" d="M960 286 L980 286 L980 231 L1000 231"/><path class="line red" d="M960 320 L980 320 L980 371 L1000 371"/>

  <!-- L2 to DCA L2 -->
  <path class="line blue" d="M1080 272 L1080 490"/><path class="line red" d="M1080 412 L1080 490"/><path class="line dash thin" d="M507 708 L975 708 L975 540 L1000 540"/>

  <!-- DCA L2 to L3 -->
  <path class="line blue" d="M1088 590 L1088 620 L865 620 L865 650"/><path class="line red" d="M1088 590 L1088 650"/>

  <!-- L3 to DCA L3 -->
  <path class="line blue" d="M865 732 L865 790"/><path class="line red" d="M1080 732 L1080 790"/><path class="line dash thin" d="M507 708 L760 708 L760 830 L785 830"/>

  <!-- Encoder to decoder -->
  <path class="line purple" d="M1160 830 L1235 830 L1235 254 L1300 254"/>
  <path class="line purple dash" d="M1175 540 L1260 540 L1260 438 L1300 438"/>
  <path class="line purple dash" d="M960 302 L1240 302 L1240 628 L1300 628"/>
  <path class="line purple" d="M1392 302 L1392 385"/><path class="line purple" d="M1392 491 L1392 575"/>

  <!-- Decoder to heads/reconstruction -->
  <path class="line green" d="M1485 628 L1515 628 L1515 229 L1570 229"/><path class="line green" d="M1485 628 L1515 628 L1515 229 L1710 229"/>
  <path class="line green" d="M1768 273 L1768 350"/><path class="line green" d="M1628 273 L1628 540"/>
  <path class="line green" d="M1698 476 L1698 540"/><path class="line green" d="M1698 656 L1698 720"/><path class="line green" d="M1698 812 L1698 845"/>
  <path class="line thin dash" d="M253 546 L1535 546 L1535 600 L1570 600"/>

  <rect x="70" y="945" width="1760" height="80" rx="18" fill="#f8fafc" stroke="#e4e7ec" stroke-width="1.2"/>
  <text class="legend" x="95" y="976">Faithfulness check: this figure matches the provided code structure: _content_cue, v1/i1-v3/i3 encoders, ca1-ca3, fuse_top, up2/dec2, up1/dec1, out_rgb, out_ir_w, target_y, pred_mix, luminance ratio color recovery, and auxiliary outputs.</text>
  <text class="legend" x="95" y="1004">Connector convention: solid blue/red = VIS/IR feature flow; dashed gray = cue/skip buses; purple = fused decoder flow; green = output reconstruction.</text>
</svg>
