# ros_gz_bridge config template.
# Placeholders are substituted at runtime by 04_ros_gz_bridge.sh
#
# Docs: https://github.com/gazebosim/ros_gz

- gz_topic_name: "__GZ_IMAGE_TOPIC__"
  ros_topic_name: "__ROS_IMAGE_TOPIC__"
  ros_type_name: "sensor_msgs/msg/Image"
  gz_type_name: "gz.msgs.Image"
  direction: GZ_TO_ROS
  lazy: false

- gz_topic_name: "__GZ_CAMERA_INFO_TOPIC__"
  ros_topic_name: "__ROS_CAMERA_INFO_TOPIC__"
  ros_type_name: "sensor_msgs/msg/CameraInfo"
  gz_type_name: "gz.msgs.CameraInfo"
  direction: GZ_TO_ROS
  lazy: false

- gz_topic_name: "__GZ_IMU_TOPIC__"
  ros_topic_name: "__ROS_IMU_TOPIC__"
  ros_type_name: "sensor_msgs/msg/Imu"
  gz_type_name: "gz.msgs.IMU"
  direction: GZ_TO_ROS
  lazy: false
